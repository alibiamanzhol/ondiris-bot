name: Проверка реестра

on:
  schedule:
    # 09:00 и 18:00 по Астане (UTC+5)
    - cron: "0 4 * * *"
    - cron: "0 13 * * *"
  push:
    branches: [main]
    paths: ["check.py", "inbox.py", ".github/workflows/check.yml"]
  workflow_dispatch:
    inputs:
      debug:
        description: "Сохранить ответы API в ветку debug"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: registry-check

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверка
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          REGISTRY_API_URL: ${{ vars.REGISTRY_API_URL }}
          DEBUG: ${{ (inputs.debug || github.event_name == 'push') && '1' || '' }}
        run: python check.py | tee debug-log.txt

      - name: Сохранить состояние
        if: always()
        run: |
          git config user.name "registry-bot"
          git config user.email "registry-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Обновление списка и состояния" && git pull --rebase && git push)

      - name: Отладка в ветку debug
        if: always() && (inputs.debug || github.event_name == 'push')
        run: |
          mkdir -p debug && mv debug-log.txt debug/ 2>/dev/null || true
          cd debug
          git init -q -b debug
          git add -A
          git -c user.name=registry-bot -c user.email=registry-bot@users.noreply.github.com commit -qm "debug ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" debug
