name: Сообщения боту

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: registry-check

jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Обработка сообщений
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python inbox.py

      - name: Сохранить изменения
        run: |
          git config user.name "registry-bot"
          git config user.email "registry-bot@users.noreply.github.com"
          git add state.json bins.txt
          git diff --cached --quiet || (git commit -m "Обновление списка БИН" && git pull --rebase && git push)
